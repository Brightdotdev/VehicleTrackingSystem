server :
  port : 8105
  forward-headers-strategy: framework

spring:
  main:
    lazy-initialization: true
  application:
    name: dispatchService
  datasource :
    url : jdbc:postgresql://localhost:5432/VEHICLE_DISPATCH_DB
    username : postgres
    password : bomboclat
  jpa :
    open-in-view: false
    show-sql : true
    hibernate :
      ddl-auto : update
  rabbitmq:
    host: localhost
    port: 5672
    username: bright
    password: secret123
    listener:
      simple:
        default-requeue-rejected: false  # Don’t keep retrying forever
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000


auth:
  jwt:
    secret: 6715c78c9a1d53f358dafd68da12c40c95780b0d00486f9d725672b7bf95eea89d682826b22883dd592b45b6ee2f79d4d4372d0c136b2e6fb1935c04f7593d05
    expiration: 604800000
    issuer: auth-service


logging:
  level:
    org.springframework.amqp: WARN
    com.rabbitmq: WARN
    org.springframework.security: DEBUG
    com.example.UserService: DEBUG


resilience4j:
  circuitbreaker:
    instances:
      myServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 15
        minimumNumberOfCalls: 10
        failureRateThreshold: 80
        waitDurationInOpenState: 22s
        permittedNumberOfCallsInHalfOpenState: 7
        automaticTransitionFromOpenToHalfOpenEnabled: true