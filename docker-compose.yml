

services:
  # ==== DATABASE SERVICES ====
  postgres-db:
    image: postgres:16
    container_name: postgres-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DEFAULT}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_DEFAULT}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - vehicle-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - vehicle-network

  mongo-logging:
    image: mongo:6
    container_name: mongo-logging
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vehicle-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo-logging
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8082:8081"
    depends_on:
      - mongo-logging
    networks:
      - vehicle-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - vehicle-network

  # ==== SPRING BOOT SERVICES ====
  api-gateway:
    build: ./SPRING-SERVICES/ApiGateway
    env_file: .env
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on:
      - auth-service
      - logging-service
      - dispatch-service
      - vehicle-service
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_GATEWAY_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - vehicle-network

  auth-service:
    build: ./SPRING-SERVICES/AuthService
    env_file: .env
    ports:
      - "${AUTH_SERVICE_APP_PORT}:${AUTH_SERVICE_APP_PORT}"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AUTH_SERVICE_APP_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - vehicle-network

  dispatch-service:
    build: ./SPRING-SERVICES/DispatchService
    env_file: .env
    ports:
      - "${DISPATCH_SERVICE_APP_PORT}:${DISPATCH_SERVICE_APP_PORT}"
    depends_on:
      - postgres-db
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DISPATCH_SERVICE_APP_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - vehicle-network

  logging-service:
    build: ./SPRING-SERVICES/logging-tracking-service
    env_file: .env
    ports:
      - "${LOGGING_SERVICE_APP_PORT}:${LOGGING_SERVICE_APP_PORT}"
    depends_on:
      - mongo-logging
    networks:
      - vehicle-network

  vehicle-service:
    build: ./SPRING-SERVICES/VehicleService
    env_file: .env
    ports:
      - "${VEHICLE_SERVICE_APP_PORT}:${VEHICLE_SERVICE_APP_PORT}"
    depends_on:
      - postgres-db
    networks:
      - vehicle-network

  # ==== FRONTEND SERVICES ====
  admin-desk:
    build: ./VIEWS/admin_desk_web
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - vehicle-network

  user-auto-port:
    build: ./VIEWS/user_auto_port_web
    env_file: .env
    ports:
      - "3001:3000"
    depends_on:
      - api-gateway
    networks:
      - vehicle-network

volumes:
  postgres_data:
  mongo_data:

networks:
  vehicle-network:
    driver: bridge