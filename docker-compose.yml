services:
  # ==== DATABASE SERVICES ====
  postgres-db:
    image: postgres:16
    container_name: postgres-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DEFAULT}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_DEFAULT}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - vehicle-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5051:80"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - vehicle-network

  mongo-logging:
    image: mongo:6
    container_name: mongo-logging
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 30s
    networks:
      - vehicle-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_running && rabbitmq-diagnostics check_local_alarms"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - vehicle-network

  # ==== SPRING BOOT SERVICES ====
  api-gateway:
    build: ./SPRING-SERVICES/ApiGateway
    env_file: .env
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on:
      - auth-service
      - logging-service
      - vehicle-service
      - dispatch-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${API_GATEWAY_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 90s
    networks:
      - vehicle-network

  auth-service:
    build: ./SPRING-SERVICES/AuthService
    env_file: .env
    ports:
      - "${AUTH_SERVICE_APP_PORT}:${AUTH_SERVICE_APP_PORT}"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${AUTH_SERVICE_APP_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 60s
    networks:
      - vehicle-network

  dispatch-service:
    build: ./SPRING-SERVICES/DispatchService
    env_file: .env
    ports:
      - "${DISPATCH_SERVICE_APP_PORT}:${DISPATCH_SERVICE_APP_PORT}"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${DISPATCH_SERVICE_APP_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 60s
    networks:
      - vehicle-network

  logging-service:
    build: ./SPRING-SERVICES/logging-tracking-service
    env_file: .env
    ports:
      - "${LOGGING_SERVICE_APP_PORT}:${LOGGING_SERVICE_APP_PORT}"
    depends_on:
      mongo-logging:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${LOGGING_SERVICE_APP_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 60s
    networks:
      - vehicle-network

  vehicle-service:
    build: ./SPRING-SERVICES/VehicleService
    env_file: .env
    ports:
      - "${VEHICLE_SERVICE_APP_PORT}:${VEHICLE_SERVICE_APP_PORT}"
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${VEHICLE_SERVICE_APP_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - vehicle-network
  
