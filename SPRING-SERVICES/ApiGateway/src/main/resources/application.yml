server:
  port: ${API_GATEWAY_PORT}
  forward-headers-strategy: framework

spring:
  main:
    lazy-initialization: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: authService
          uri : ${AUTH_SERVICE_URL}
          predicates:
            - Path=/v1/auth/admin/**, /v1/auth/user/**
          filters:
            - name: DedupeResponseHeader
              args:
                name: Access-Control-Allow-Origin
                strategy: RETAIN_FIRST
        - id: loggingService
          uri : ${LOGGING_SERVICE_URL}
          predicates:
            - Path=/v1/user/notifications/**, /v1/sse/**, /v1/user/tracking/**
          filters:
            - name: DedupeResponseHeader
              args:
                name: Access-Control-Allow-Origin
                strategy: RETAIN_FIRST
        - id: dispatchService
          uri : ${DISPATCH_SERVICE_URL}
          predicates:
            - Path=/v1/admin/dispatch/**, /v1/user/dispatch/**
          filters:
            - name: DedupeResponseHeader
              args:
                name: Access-Control-Allow-Origin
                strategy: RETAIN_FIRST
        - id: vehicleService
          uri: ${VEHICLE_SERVICE_URL}
          predicates:
            - Path=/v1/admin/vehicle/**, /v1/user/vehicle/**
          filters:
            - name: DedupeResponseHeader
              args:
                name: Access-Control-Allow-Origin
                strategy: RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - ${AUTO_PORT_URL}
              - ${ADMIN_DESK_URL}
            allowed-methods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "PATCH"
              - "OPTIONS"
            allowed-headers:
              - "Content-Type"
              - "Authorization"
              - "X-Requested-With"
              - "Origin"
              - "Accept"
              - "X-XSRF-TOKEN"
            allow-credentials: true
            exposed-headers:
              - "Set-Cookie"
              - "Authorization"
            max-age: 3600

auth:
  api:
    key : ${API_INTERNAL_KEY}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXP}

logging:
  level:
    org.springframework.security: DEBUG
    com.example.UserService: DEBUG