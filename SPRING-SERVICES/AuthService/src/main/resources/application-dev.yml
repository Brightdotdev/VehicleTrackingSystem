server :
  port : 8103
  forward-headers-strategy: framework

spring:
  main:
    lazy-initialization: true
  application:
    name: authService
  datasource :
    url : jdbc:postgresql://localhost:5432/VEHICLE_AUTH_DB
    username : postgres
    password : bomboclat
  jpa :
    open-in-view: false
    show-sql : true
    hibernate :
      ddl-auto : update


auth:
  api:
    key : internalKey
  jwt:
    secret: 431da76bdce7104b0a69902ede07459b0087f110d969fb15fef07afc899012ac07bc3435d063f8619c1523d917e84024ee8784c3f2e619c1efb770d86221bf35
    expiration: 604800000
