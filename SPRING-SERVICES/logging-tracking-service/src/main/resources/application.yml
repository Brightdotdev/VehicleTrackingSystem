server:
  port: ${LOGGING_SERVICE_APP_PORT}
  forward-headers-strategy: framework

spring:
  main:
    lazy-initialization: true
  application:
    name: loggingService
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  data:
    mongodb:
      auto-index-creation: true
      uri: ${LOGGING_SERVICE_MONGO_URL}  # e.g. mongodb://mongo-logging:27017/logging_mongo_db
  rabbitmq:
    host: ${RABBITMQ_URL}      # e.g. rabbitmq
    port: ${RABBITMQ_PORT}     # e.g. 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

auth:
  api:
    key: ${API_INTERNAL_KEY}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXP}
    issuer: auth-service

external:
  services:
    vehicle:
      base-url: ${VEHICLE_SERVICE_URL}
    dispatch:
      base-url: ${DISPATCH_SERVICE_URL}

messaging:
  type: ${MESSAGE_TYPE}

logging:
  level:
    org.springframework.amqp: WARN
    com.rabbitmq: WARN
    org.springframework.security: DEBUG
    com.example.logging-tracking-service: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      myServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 15
        minimumNumberOfCalls: 10
        failureRateThreshold: 80
        waitDurationInOpenState: 22s
        permittedNumberOfCallsInHalfOpenState: 7
        automaticTransitionFromOpenToHalfOpenEnabled: true
