server :
  port : 8106
  forward-headers-strategy: framework

spring:
  main:
    lazy-initialization: true
  application:
    name: vehicleService
  datasource :
    url : jdbc:postgresql://localhost:5432/VEHICLE_VEHICLE_DB
    username : postgres
    password : bomboclat
  jpa :
    open-in-view: false
    show-sql : true
    hibernate :
      ddl-auto : update
  rabbitmq:
    host: localhost
    port: 5672
    username: bright
    password: secret123
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000



external:
  services:
    logging:
      base-url: http://localhost:8104
    dispatch:
      base-url: http://localhost:8105



messaging:
  type: webClient


auth:
  api:
    key : internalKey
  jwt:
    secret: 431da76bdce7104b0a69902ede07459b0087f110d969fb15fef07afc899012ac07bc3435d063f8619c1523d917e84024ee8784c3f2e619c1efb770d86221bf35
    expiration: 604800000
    issuer: auth-service


logging:
  level:
    org.springframework.amqp: WARN
    com.rabbitmq: WARN
    org.springframework.security: DEBUG
    com.example.VehicleService: DEBUG


resilience4j:
  circuitbreaker:
    instances:
      myServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 15
        minimumNumberOfCalls: 10
        failureRateThreshold: 80
        waitDurationInOpenState: 22s
        permittedNumberOfCallsInHalfOpenState: 7
        automaticTransitionFromOpenToHalfOpenEnabled: true