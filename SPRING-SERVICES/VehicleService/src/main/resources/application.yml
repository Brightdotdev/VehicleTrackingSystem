server :
  port : ${VEHICLE_SERVICE_APP_PORT}
  forward-headers-strategy: framework

spring:
  main:
    lazy-initialization: true
  application:
    name: vehicleService
  datasource :
    url : ${VEHICLE_SERVICE_SQL_URL}
    username : ${POSTGRES_USER}
    password : ${POSTGRES_PASSWORD}
  jpa :
    open-in-view: false
    show-sql : true
    hibernate :
      ddl-auto : update
  rabbitmq:
    host: ${RABBITMQ_URL}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: {RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: AUTO
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false


auth:
  api:
    key : ${API_INTERNAL_KEY}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXP}
    issuer: auth-service

external:
  services:
    logging:
      base-url: ${LOGGING_SERVICE_URL}
    dispatch:
      base-url: ${DISPATCH_SERVICE_URL}


messaging:
  type: ${MESSAGE_TYPE}

logging:
  level:
    org.springframework.amqp: WARN
    com.rabbitmq: WARN
    org.springframework.security: DEBUG
    com.example.VehicleService: DEBUG


resilience4j:
  circuitbreaker:
    instances:
      myServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 15
        minimumNumberOfCalls: 10
        failureRateThreshold: 80
        waitDurationInOpenState: 22s
        permittedNumberOfCallsInHalfOpenState: 7
        automaticTransitionFromOpenToHalfOpenEnabled: true